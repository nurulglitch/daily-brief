# 信源清单。增删信源只改这个文件，改完跑 `uv run brief check-sources` 体检。
#
# section  板块：world 全球局势 | security 战争与安全 | macro 金融宏观 | tech AI 与硬科技 | bio 生命科学与医学 | longread 周日长文
# role     用法：
#   open      开放可读的新闻源：提供事实素材，入选后可补抓正文
#   signal    付费墙 / 期刊目录 / 热度榜：只用 RSS 里的标题和摘要判断“什么重要”，从不抓正文
#   official  官方一手发布：单源也可入选，入选后可补抓正文
#   analysis  分析评论：一般只作背景，含重要新事实时才可入选
# 可选字段：lang（默认 "en"）、max_age_days（覆盖默认时效）、note（会原样提示给模型）

